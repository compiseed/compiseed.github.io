<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>文字とひし形の下端をそろえた3案 | CompiSeed</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#292b25;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;line-height:1.7;-webkit-text-size-adjust:100%}main{width:min(100% - 32px,700px);margin:24px auto 40px}h1{font-size:22px;line-height:1.5;margin:0 0 8px}p{font-size:15px;margin:0 0 20px}a{color:#354d3a;text-underline-offset:4px}.links{display:flex;flex-wrap:wrap;gap:16px;margin-top:20px}.links a{display:inline-flex;min-height:44px;align-items:center}.option{margin:24px 0}.option h2{font-size:16px;font-weight:500;line-height:1.6;margin:0 0 10px}.sample{background:#f7f7f2;border:1px solid #dedfd5;border-radius:12px;padding:24px 22px;min-height:100px;display:flex;align-items:center}.brand{display:inline-flex;align-items:center;gap:10px;color:#101e47;font-size:24px;line-height:1.8;font-weight:750;letter-spacing:-1px;white-space:nowrap}.symbol{position:relative;width:calc(38px * var(--mark-scale));height:calc(50px * var(--mark-scale));overflow:hidden;display:block;flex:none;mix-blend-mode:multiply}.symbol img{position:absolute;display:block;width:calc(74px * var(--mark-scale));height:calc(74px * var(--mark-scale));max-width:none;left:calc(-21px * var(--mark-scale));top:calc(-8px * var(--mark-scale))}.wordmark{font-size:24px}
    .brand{align-items:flex-end}.wordmark{display:block;line-height:1}.baseline-probe{display:inline-block;width:0;height:0;vertical-align:baseline}
  </style>
</head>
<body>
  <main>
    <h1>文字とひし形の下端をそろえた3案</h1>
    <p>文字サイズはそのまま。文字の下端を、ひし形マークの下端に合わせています。</p>
    <section class="option" style="--mark-scale:.9" aria-labelledby="option-a"><h2 id="option-a">A：マーク90％（10％縮小）</h2><div class="sample"><div class="brand"><span class="symbol"><img src="../../assets/compiseed-logo.jpg" width="573" height="573" alt="CompiSeedのシンボルマーク"></span><span class="wordmark">CompiSeed</span></div></div></section>
    <section class="option" style="--mark-scale:.8" aria-labelledby="option-b"><h2 id="option-b">B：マーク80％（20％縮小）</h2><div class="sample"><div class="brand"><span class="symbol"><img src="../../assets/compiseed-logo.jpg" width="573" height="573" alt="CompiSeedのシンボルマーク"></span><span class="wordmark">CompiSeed</span></div></div></section>
    <section class="option" style="--mark-scale:.7" aria-labelledby="option-c"><h2 id="option-c">C：マーク70％（30％縮小）</h2><div class="sample"><div class="brand"><span class="symbol"><img src="../../assets/compiseed-logo.jpg" width="573" height="573" alt="CompiSeedのシンボルマーク"></span><span class="wordmark">CompiSeed</span></div></div></section>
    <div class="links"><a href="../../">現在の公式サイトを見る</a></div>
  </main>
  <script>
    function alignLogoBottoms(){
      const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');
      document.querySelectorAll('.brand').forEach(brand=>{
        const word=brand.querySelector('.wordmark');
        let probe=word.querySelector('.baseline-probe');
        if(!probe){probe=document.createElement('span');probe.className='baseline-probe';probe.setAttribute('aria-hidden','true');word.append(probe);}
        word.style.transform='none';
        const font=getComputedStyle(word);ctx.font=font.fontWeight+' '+font.fontSize+' '+font.fontFamily;
        const textBottom=probe.getBoundingClientRect().top+ctx.measureText('CompiSeed').actualBoundingBoxDescent;
        const image=brand.querySelector('.symbol img').getBoundingClientRect();
        const diamondBottom=image.top+image.height*439/573;
        word.style.transform='translateY('+(diamondBottom-textBottom)+'px)';
        brand.dataset.bottomAligned='true';
      });
    }
    document.fonts.ready.then(alignLogoBottoms);
    window.addEventListener('resize',alignLogoBottoms);
  </script>
</body>
</html>
